x-odyssey-logging: &odyssey-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:${ODYSSEY_POSTGRES_MAJOR:-16}
    environment:
      POSTGRES_USER: ${ODYSSEY_DB_OWNER_USER:-odyssey_owner}
      POSTGRES_DB: ${ODYSSEY_DB_NAME:-odyssey}
      POSTGRES_PASSWORD: ${ODYSSEY_DB_OWNER_PASSWORD:?set ODYSSEY_DB_OWNER_PASSWORD in .env.pilot}
    volumes:
      - odyssey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *odyssey-logging
    networks: [data]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${ODYSSEY_DB_MIGRATION_DATABASE_URL:?set the migration role URL with host db}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

  provision-db-roles:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    command: ["node", "scripts/provision-pilot-db-roles.mjs"]
    environment:
      ODYSSEY_DB_NAME: ${ODYSSEY_DB_NAME:-odyssey}
      ODYSSEY_DB_OWNER_USER: ${ODYSSEY_DB_OWNER_USER:-odyssey_owner}
      ODYSSEY_DB_OWNER_DATABASE_URL: ${ODYSSEY_DB_OWNER_DATABASE_URL:?set the bootstrap owner URL with host db}
      ODYSSEY_DB_MIGRATION_USER: ${ODYSSEY_DB_MIGRATION_USER:-odyssey_migration}
      ODYSSEY_DB_MIGRATION_PASSWORD: ${ODYSSEY_DB_MIGRATION_PASSWORD:?set the migration role password}
      ODYSSEY_DB_RUNTIME_USER: ${ODYSSEY_DB_RUNTIME_USER:-odyssey_runtime}
      ODYSSEY_DB_RUNTIME_PASSWORD: ${ODYSSEY_DB_RUNTIME_PASSWORD:?set the runtime role password}
      ODYSSEY_DB_BACKUP_USER: ${ODYSSEY_DB_BACKUP_USER:-odyssey_backup}
      ODYSSEY_DB_BACKUP_PASSWORD: ${ODYSSEY_DB_BACKUP_PASSWORD:?set the backup role password}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: backup-runtime
    environment:
      ODYSSEY_DB_BACKUP_DATABASE_URL: ${ODYSSEY_DB_BACKUP_DATABASE_URL:?set the backup role URL with host db}
      ODYSSEY_BACKUP_DIRECTORY: /backups
    volumes:
      - type: bind
        source: ${ODYSSEY_BACKUP_DIRECTORY:?set an existing protected host backup directory}
        target: /backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-runtime
    environment:
      NODE_ENV: production
      API_PORT: 4000
      ALLOWED_ORIGINS: ${ODYSSEY_ALLOWED_ORIGINS:?set an explicit browser origin allowlist}
      API_PUBLIC_BASE_URL: ${ODYSSEY_API_PUBLIC_BASE_URL:?set the externally reachable API base URL}
      WEB_PUBLIC_BASE_URL: ${ODYSSEY_WEB_PUBLIC_BASE_URL:?set the externally reachable web base URL}
      TRUST_PROXY: ${ODYSSEY_TRUST_PROXY:?set false, loopback, or the trusted proxy hop count}
      DATABASE_URL: ${ODYSSEY_DB_RUNTIME_DATABASE_URL:?set the runtime role URL with host db}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.pilot}
      JWT_ISSUER: ${JWT_ISSUER:-project-odyssey-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-project-odyssey-clients}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      ODYSSEY_INTELLIGENCE_ENABLED: ${ODYSSEY_INTELLIGENCE_ENABLED:?set true or false explicitly}
      ODYSSEY_INTELLIGENCE_SERVICE_URL: ${ODYSSEY_INTELLIGENCE_SERVICE_URL:-http://ai:8000}
      ODYSSEY_INTELLIGENCE_TIMEOUT_MS: ${ODYSSEY_INTELLIGENCE_TIMEOUT_MS:-2000}
      ODYSSEY_WEATHER_PROVIDER_ENABLED: ${ODYSSEY_WEATHER_PROVIDER_ENABLED:-false}
      ODYSSEY_WEATHER_PROVIDER_DEPLOYMENT_CLASS: ${ODYSSEY_WEATHER_PROVIDER_DEPLOYMENT_CLASS:-DISABLED}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ODYSSEY_API_BIND_HOST:-127.0.0.1}:${ODYSSEY_API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *odyssey-logging
    networks: [edge, data, intelligence]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ODYSSEY_WEB_BIND_HOST:-127.0.0.1}:${ODYSSEY_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *odyssey-logging
    networks: [edge]

  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *odyssey-logging
    networks: [intelligence]

volumes:
  odyssey_pgdata:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  intelligence:
    driver: bridge
    internal: true
